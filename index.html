<!DOCTYPE html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <link rel="icon" type="image/png" sizes="32x32" href="./assets/images/favicon-32x32.png">

  <link rel="stylesheet" href="./css/style.css">

  <title>Frontend Mentor | Results summary component</title>
</head>

<body>
  <main>
    <section class="results">
      <h2 class="result-title">Your Result</h2>

      <div class="results-score">
        <p class="results-score_number">76</p>
        <p class="results-score_total">of 100</p>
      </div>

      <h3 class="results-heading">Great</h3>

      <p class="results-description">You scored higher than 65% of the people who have taken these tests.</p>
    </section>

    <section class="summary">
      <div class="summary-container">
        <h2 class="summary-title">Summary</h2>

        <div class="summary-category reaction">
          <div class="summary-icon_sub">
            <img class="summary-icon" src="./assets/images/icon-reaction.svg" alt="Reaction Icon">
            <p class="summary-subtitle">Reaction</p>
          </div>

          <div class="score-total">
            <p class="summary-score">80</p>
            <p class="summary-score_total">/ 100</p>
          </div>
        </div>
        <div class="summary-category memory">
          <div class="summary-icon_sub">
            <img class="summary-icon" src="./assets/images/icon-memory.svg" alt="Memory Icon">
            <p class="summary-subtitle">Memory</p>
          </div>

          <div class="score-total">
            <p class="summary-score">92</p>
            <p class="summary-score_total">/ 100</p>
          </div>

        </div>
        <div class="summary-category verbal">
          <div class="summary-icon_sub">
            <img class="summary-icon" src="./assets/images/icon-verbal.svg" alt="Verbal Icon">
            <p class="summary-subtitle">Verbal</p>
          </div>

          <div class="score-total">
            <p class="summary-score">61</p>
            <p class="summary-score_total">/ 100</p>
          </div>

        </div>
        <div class="summary-category visual">
          <div class="summary-icon_sub">
            <img class="summary-icon" src="./assets/images/icon-visual.svg" alt="Visual Icon">
            <p class="summary-subtitle">Visual</p>
          </div>

          <div class="score-total">
            <p class="summary-score">72</p>
            <p class="summary-score_total">/ 100</p>
          </div>

        </div>

        <a class="continue-button" href="#">Continue</a>
      </div>
    </section>
  </main>

  <footer class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge">Frontend Mentor</a>.
    Coded by <a href="https://github.com/oguilhermekenzo">Guilherme Kenzo</a>.
  </footer>
</body>

</html>
